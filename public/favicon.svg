<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bg-grad)" stroke="#16a34a" stroke-width="16" stroke-opacity="0.35" />

  <!-- Terminal Icon: chevron > and cursor _ -->
  <path d="M 136 152 L 256 256 L 136 360" fill="none" stroke="url(#green-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="284" y1="360" x2="376" y2="360" stroke="url(#green-grad)" stroke-width="48" stroke-linecap="round" filter="url(#glow)" />
</svg>